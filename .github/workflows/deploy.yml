# Publishes the game to GitHub Pages and adds the report link from the
# REPORT_URL secret, so the link never appears in this repository's files.
name: Publish game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Add the report link from the REPORT_URL secret
        env:
          REPORT_URL: ${{ secrets.REPORT_URL }}
        run: |
          if [ -z "$REPORT_URL" ]; then
            echo "::warning::The REPORT_URL secret is not set, so class reports are switched off."
          else
            sed -i "s#reportUrl: ''#reportUrl: '${REPORT_URL}'#" settings.js
          fi

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
